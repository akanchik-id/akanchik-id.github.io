ость",items:["2.1. Для полноценного использования Сервиса вам обязательно потребуется создать учетную запись.","2.2. Вы обязуетесь предоставлять достоверную информацию при регистрации и поддерживать её в актуальном состоянии.","2.3. Вы несете полную ответственность за безопасность своего пароля и за все действия, совершенные под вашим аккаунтом.","2.4. Сервис старается защищать данные. Но безопасность - это общая задача.","2.5. Сервис требует привязку Telegram для защиты и отправления уведомлении."]}],conduct:{id:"conduct",num:"3.",title:"Правила поведения и контент",lead:"Мы стремимся поддерживать дружелюбную и безопасную атмосферу. Категорически запрещается:",block1Title:"Категорически запрещается",block1:["Публиковать спам, вредоносное ПО, фишинговые ссылки или рекламу без нашего согласия.","Нарушать личные границы — выкладывать чужие материалы(Лицо, характер, работы…) без разрешения человека.","Пытаться взломать Сервис, вмешиваться в его работу, обходить системы защиты или использовать сторонние скрипты для автоматизации действий (ботов).","Оскорбление чужих семей, родных, близких человеков. Оскорбление человека без весомых причин.","Нарушение действующего законодательства страны, резидентом которой является пользователь, или законов по месту нахождения Сервиса.","Накрутка подписчиков, лайков и комментариев путем обмана.","Выдавать себя за медийную/популярную личность. Все учетные записи модерируется вручную."],block2Title:"Запреты на размещение следующих материалов",block2:["18+/NSFW контенты, натуралистичные кадры насилия, увечий или реальной смерти людей и животных (включая шок-контент), интимные места, неприятные зрелища.","Пропаганда или оправдания нацизма, фашизма, расизма, ксенофобии и идей национального превосходства.","Инструкция создания оружия, взрывчатых веществ, наркотиков и других совершенно не законных действий.","Пропаганда суицида или Self-harming.","Призывы к терроризму, экстремизму, массовым беспорядкам и насильственному изменению конституционного строя.","Жестокое обращение с животными.","Дипфейки, дезинформация."],after:"3.1. Имейте человечность в социальной сети. Каждый в праве быть человеком, со своим вкусом и так далее."},rights:{id:"rights",num:"4.",title:"Права на контент",items:["4.1. Весь контент, который вы создаете и публикуете (тексты, фото, видео), остается вашей собственностью.","4.2. Публикуя контент в Сервисе, вы предоставляете нам неисключительную лицензию на его хранение, отображение и трансляцию другим пользователям в рамках работы платформы."]},liability:{id:"liability",num:"5.",title:"Ответственность и ограничения",items:["5.1. Сервис предоставляется по принципу «как есть» (as is). Мы не гарантируем бесперебойную или безошибочную работу платформы, хотя и стараемся её улучшать.","5.2. Мы имеем право (но не обязаны) удалять любой контент и блокировать аккаунты пользователей, которые нарушают правила Соглашения или законодательство, без предварительного уведомления.","5.3. Мы не несем ответственности за убытки или ущерб, возникшие у пользователя из-за сбоев в работе Сервиса или действий других пользователей."]},moderation:{id:"moderation",num:"6.",title:"Модерация и блокировки",items:["6.1. При обнаружении нарушения, сервис имеет полное право проверять что-либо вручную(Чаты/Группы/Каналы/Профили).","6.2 Некоторые посты/профили проверяются вручную(Когда эти материалы попадутся в руки модератора)","6.3. Администрация вправе наложить санкции для определенного человека. Администрация в праве наложить санкции для конкретного человека."]},contacts:{title:"Контакты",lead:"Если у вас есть вопросы по поводу данного Соглашения, вы можете связаться с нами:",email:"akanchikir@gmail.com",site:"https://akanchik-id.github.io/user/undersupport",siteLabel:"Under",telegram:"https://t.me/razvyazcka"},footer:"© 2026  ·  Дата вступления 27.09.2026"},en:{badge:"Effective September 27, 2026",title:"User Agreement",titleSub:"(Terms of Use)",dateLabel:"Effective Date: September 27, 2026",introTitle:"Introductio
